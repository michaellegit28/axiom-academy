---
layout: app-shell
---

<section class="quiz-wrapper">
  <header class="animate-on-scroll">
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="quiz-card card animate-on-scroll">
    {{ content }}
  </div>

  <section class="results-header animate-on-scroll" aria-labelledby="quiz-results-title">
    <div>
      <h2 id="quiz-results-title">Your result</h2>
      <p>Review your latest performance and prepare the next focused revision step.</p>
    </div>

    <div class="score-circle">
      <strong data-count-to="87" data-count-suffix="%">0%</strong>
    </div>
  </section>

  <div class="stagger-list">
    <div class="breakdown-item">
      <span>✓</span>
      <div>
        <strong data-count-to="18">0</strong>
        <p>Correct answers</p>
      </div>
    </div>

    <div class="breakdown-item">
      <span>↺</span>
      <div>
        <strong data-count-to="7">0</strong>
        <p>Topics to revisit</p>
      </div>
    </div>
  </div>
</section>
