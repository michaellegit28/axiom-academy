---
layout: default
math: true
---
<div class="chapter-wrap">
  <div class="chapter-breadcrumb reveal visible">
    <a href="{{ '/' | relative_url }}">Axiom Academy</a> ·
    <a href="{{ '/#curriculum' | relative_url }}">Physics</a> ·
    {{ page.volume }}
  </div>

  <div class="chapter-header reveal visible">
    <div class="chapter-eyebrow">{{ page.volume }} · Chapter {{ page.chapter_number }}</div>
    <h1 class="chapter-title">{{ page.title }}</h1>
  </div>

  <div class="chapter-body reveal visible">
    {{ content }}
  </div>

  <div class="chapter-nav">
    {% if page.prev_url %}<a href="{{ page.prev_url | relative_url }}">← Previous</a>{% else %}<span></span>{% endif %}
    {% if page.next_url %}<a href="{{ page.next_url | relative_url }}">Next →</a>{% endif %}
  </div>
</div>
