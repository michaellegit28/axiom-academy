<section class="profile-page">
  <header class="animate-on-scroll">
    <h1>{{ page.title | default: 'Profile' }}</h1>
    <p>{{ page.description | default: 'Review your growth, habits, and strongest learning areas at a glance.' }}</p>
  </header>

  <div class="profile-grid stagger-list" style="margin: 1rem 0 2rem;">
    <article class="profile-card card">
      <h2>Mastery</h2>
      <strong data-count-to="84" data-count-suffix="%">0%</strong>
    </article>

    <article class="profile-card card">
      <h2>Study sessions</h2>
      <strong data-count-to="52">0</strong>
    </article>

    <article class="profile-card card">
      <h2>Current streak</h2>
      <strong data-count-to="11" data-count-suffix=" days">0 days</strong>
    </article>
  </div>

  {% include progress-charts.html %}
</section>
