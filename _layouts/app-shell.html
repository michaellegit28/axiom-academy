<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){var t=localStorage.getItem('axiom-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    window.AXIOM_BASE_URL={{ site.baseurl | jsonify }};
    window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/app.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/premium.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/flashcards.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/profile.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/phase6.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/home-workspace.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/page-rhythm.css">
  {% include pwa-meta.html %}
  {% include firebase-init.html %}
</head>
<body class="page-{{ page.title | slugify }}">
  {% include nav.html %}
  {% include offline-banner.html %}
  <main id="app-content">
    {{ content }}
  </main>
  {% include auth-modal.html %}
  {% include ai-chat.html %}
  <script type="module" src="{{ site.baseurl }}/assets/js/auth.js"></script>
  <script type="module" src="{{ site.baseurl }}/assets/js/app-shell.js"></script>
  <script type="module">
    import { initStudyRouting } from "{{ '/assets/js/axiom-study-routing.js' | relative_url }}";
    document.addEventListener('DOMContentLoaded', initStudyRouting);
  </script>
</body>
</html>
