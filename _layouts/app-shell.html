<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>{{ page.title | default: site.title }}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/flashcards.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/profile.css">

  {% include firebase-init.html %}
</head>
<body>
  <div id="app">
    <header class="app-header">
      <a href="{{ site.baseurl }}/" class="logo">Axiom</a>
      <div class="header-actions">
        <button id="auth-btn" class="btn-ghost">Sign In</button>
      </div>
    </header>

    <main id="app-content">
      {{ content }}
    </main>

    {% include bottom-nav.html %}
  </div>

  {% include auth-modal.html %}

  <script type="module" src="{{ site.baseurl }}/assets/js/auth.js"></script>
  <script type="module" src="{{ site.baseurl }}/assets/js/app-shell.js"></script>
</body>
</html>
