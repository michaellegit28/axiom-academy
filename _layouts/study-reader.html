---
layout: app-shell
---

<section class="study-reader">
  <aside class="study-reader-toc animate-on-scroll">
    {% if page.toc %}
      <nav aria-label="Table of contents">
        {{ page.toc }}
      </nav>
    {% endif %}
  </aside>

  <div class="study-reader-main">
    <header class="study-reader-header animate-on-scroll">
      {% if page.breadcrumb %}
        <p class="animate-on-scroll">{{ page.breadcrumb }}</p>
      {% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p>{{ page.description }}</p>
      {% endif %}
    </header>

    <article class="study-reader-section animate-on-scroll">
      <div class="table-scroll">
        {{ content }}
      </div>
    </article>

    <footer class="study-reader-footer animate-on-scroll">
      <a class="study-action btn" href="{{ page.prev_url | default: '#' | relative_url }}">Previous</a>
      <a class="study-action btn" href="{{ '/' | relative_url }}">Back to dashboard</a>
      <a class="study-action btn" href="{{ page.next_url | default: '#' | relative_url }}">Next</a>
    </footer>
  </div>
</section>
