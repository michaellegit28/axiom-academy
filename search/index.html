---
layout: app
title: Search
permalink: /search/
---

<div class="landing-hero" style="text-align:left;">
  <h1>Search Axiom</h1>
  <p>Find real chapters, quizzes, and flashcards across every domain.</p>
</div>

<div class="search-box-wrap">
  <input type="text" id="search-input" class="search-input" placeholder="Search topics, chapters, quizzes..." autofocus>
</div>

<div id="search-results"></div>
<div id="search-empty" class="search-empty">Type at least 2 characters to search.</div>

<script>
(function () {
  var index = [];
  var input = document.getElementById('search-input');
  var resultsEl = document.getElementById('search-results');
  var emptyEl = document.getElementById('search-empty');

  fetch('{{ "/content-index.json" | relative_url }}')
    .then(function (r) { if (!r.ok) throw new Error('content index unavailable'); return r.json(); })
    .then(function (data) { index = Array.isArray(data) ? data : []; })
    .catch(function () { index = []; });

  var DOMAIN_ICONS = { 'university': '🎓', 'high-school': '🏫', 'extras': '✨' };
  var DOMAIN_LABELS = { 'university': 'University', 'high-school': 'High School', 'extras': 'Extras' };
  var TYPE_ICONS = { 'chapter': '📖', 'quiz': '🧪', 'flashcard': '🎴', 'flashcards': '🎴' };
  var TYPE_LABELS = { 'chapter': 'Chapter', 'quiz': 'Quiz', 'flashcard': 'Flashcards', 'flashcards': 'Flashcards' };

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>'"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c];
    });
  }

  function render(query) {
    if (!query || query.length < 2) {
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Type at least 2 characters to search.';
      return;
    }
    emptyEl.style.display = 'none';

    var q = query.toLowerCase();
    var matches = index.filter(function (item) {
      var fields = [item.title, item.subject, item.department, item.exam, item.topic, item.subtopic];
      return fields.some(function (field) { return String(field || '').toLowerCase().indexOf(q) !== -1; });
    });

    if (matches.length === 0) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'No results for "' + query + '".';
      resultsEl.innerHTML = '';
      return;
    }

    var grouped = {};
    matches.forEach(function (m) {
      var domain = m.domain || 'unknown';
      var type = m.contentType || 'content';
      if (!grouped[domain]) grouped[domain] = {};
      if (!grouped[domain][type]) grouped[domain][type] = [];
      grouped[domain][type].push(m);
    });

    var html = '';
    Object.keys(grouped).forEach(function (domain) {
      html += '<div class="search-group">';
      html += '<h2 class="search-group-title">' + (DOMAIN_ICONS[domain] || '📄') + ' ' + escapeHtml(DOMAIN_LABELS[domain] || domain) + '</h2>';
      Object.keys(grouped[domain]).forEach(function (type) {
        html += '<h3 class="search-group-title">' + (TYPE_ICONS[type] || '📄') + ' ' + escapeHtml(TYPE_LABELS[type] || type) + '</h3>';
        html += '<div class="search-result-list">';
        grouped[domain][type].forEach(function (item) {
          var context = [item.department, item.exam, item.subject, item.topic].filter(Boolean).join(' · ');
          html += '<a href="' + escapeHtml(item.url) + '" class="search-result-item">' +
            '<span class="search-result-icon">' + (TYPE_ICONS[type] || '📄') + '</span>' +
            '<span class="search-result-text"><b>' + escapeHtml(item.title) + '</b><small>' + escapeHtml(context || TYPE_LABELS[type] || type) + '</small></span>' +
            '</a>';
        });
        html += '</div>';
      });
      html += '</div>';
    });
    resultsEl.innerHTML = html;
  }

  input.addEventListener('input', function () { render(this.value.trim()); });
})();
</script>
