---
layout: app
title: High School Study
permalink: /high-school/subject/
---

<section class="section-block page-content-start" aria-labelledby="subject-title">
  <div class="section-heading">
    <div>
      <span class="eyebrow" id="department-label">High School · Study</span>
      <h1 id="subject-title">Choose a subject</h1>
      <p id="subject-description">Select a department, then choose a topic to explore its curriculum.</p>
    </div>
    <span class="section-note">Department → Topic → Subtopic</span>
  </div>
  <div class="track-selector" id="subject-list"></div>
</section>

<script>
const studyDepartments = {{ site.data.learning_taxonomy.high_school.study.departments | jsonify }};
const curriculumDepartments = {{ site.data.high_school_curriculum.departments | jsonify }};
const params = new URLSearchParams(window.location.search);
const departmentId = params.get('department');
const subjectId = params.get('subject');
const topicId = params.get('topic');
const department = studyDepartments.find(item => item.id === departmentId);
const list = document.getElementById('subject-list');
const title = document.getElementById('subject-title');
const label = document.getElementById('department-label');
const description = document.getElementById('subject-description');
const subjectUrl = "{{ '/high-school/subject/' | relative_url }}";
const studyUrl = "{{ '/high-school/' | relative_url }}";
const studyRoot = "{{ '/high-school/study/' | relative_url }}";
const mathematicsRoot = "{{ '/high-school/mathematics/' | relative_url }}";
function pretty(value) { return String(value || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
function findCurriculumDepartment(id) { return (curriculumDepartments || []).find(item => item.id === id) || null; }
function findCurriculumSubject(id) {
  for (const dept of (curriculumDepartments || [])) {
    const subject = (dept.subjects || []).find(item => item.id === id);
    if (subject) return subject;
  }
  return null;
}
function card(titleText, descriptionText, href, icon='📚', meta='Open') {
  const node=document.createElement('a'); node.className='track-card study-topic'; node.href=href;
  node.innerHTML=`<div class="track-icon" aria-hidden="true">${icon}</div><h2>${titleText}</h2><p>${descriptionText}</p><div class="track-meta"><span>${meta}</span></div>`;
  return node;
}
const curriculumDepartment = department ? findCurriculumDepartment(department.id) : null;
const isMathematics = departmentId === 'mathematics';
const mathTopics = curriculumDepartment?.subjects || [];
const selectedMathTopic = isMathematics && topicId ? mathTopics.find(item => item.id === topicId) : null;
const curriculumSubject = subjectId ? findCurriculumSubject(subjectId) : null;
const publishedSubtopics = {
  'number-and-numeracy': new Set(['number-systems','integers','fractions','decimals','percentages','ratios','proportions','rates-and-unit-rates','factors-and-multiples','prime-numbers','hcf-and-lcm','powers-and-exponents','roots-and-radicals','standard-form','approximation-and-estimation','significant-figures','decimal-places','bounds-and-accuracy','surds','recurring-decimals']),
  'algebra': new Set(['introduction-to-algebra','variables-and-constants','algebraic-expressions','simplifying-expressions','linear-equations','inequalities'])
};

if (!department) {
  label.textContent='High School · Study'; title.textContent='Choose a department'; description.textContent='Return to High School Study and choose a department to continue.';
  const back=document.createElement('a'); back.className='btn btn-primary'; back.href=studyUrl; back.textContent='Back to High School Study'; list.appendChild(back);
} else if (isMathematics) {
  label.textContent='Mathematics · Study';
  if (selectedMathTopic) {
    title.textContent=selectedMathTopic.name;
    description.textContent='Choose a subtopic to begin the study lesson.';
    const published = publishedSubtopics[selectedMathTopic.id] || new Set();
    (selectedMathTopic.subtopics || []).forEach(subtopic => {
      const href = `${mathematicsRoot}${selectedMathTopic.id}/${subtopic.id}/`;
      const available = published.has(subtopic.id);
      list.appendChild(card(subtopic.name, available ? 'Study the concept, worked examples, practice, and review.' : 'Curriculum subtopic prepared for the next study-content build.', href, '📘', available ? 'Study available' : 'Coming in study build'));
    });
    const back=document.createElement('a'); back.className='btn btn-secondary'; back.href=`${subjectUrl}?department=mathematics`; back.textContent='Back to Mathematics'; list.appendChild(back);
  } else {
    title.textContent='Mathematics';
    description.textContent='Choose a topic to begin studying.';
    mathTopics.forEach(topic => list.appendChild(card(topic.name, topic.description || 'Open this topic to study its subtopics.', `${subjectUrl}?department=mathematics&topic=${encodeURIComponent(topic.id)}`, '📚', `${topic.subtopics?.length || 0} subtopics`)));
    const back=document.createElement('a'); back.className='btn btn-secondary'; back.href=studyUrl; back.textContent='Back to High School Study'; list.appendChild(back);
  }
} else if (subjectId && curriculumSubject) {
  label.textContent=`${department.name} · Study`; title.textContent=curriculumSubject.name || pretty(subjectId);
  const topics=curriculumSubject.topics || [];
  const selectedTopic=topics.find(item => item.id === topicId);
  if (selectedTopic) {
    title.textContent=selectedTopic.name; description.textContent='Choose a subtopic to begin the study lesson.';
    (selectedTopic.subtopics || []).forEach(subtopic => list.appendChild(card(subtopic.name, 'Study content will be added in the subject build.', '#', '📘', 'Coming next')));
    const back=document.createElement('a'); back.className='btn btn-secondary'; back.href=`${subjectUrl}?department=${encodeURIComponent(department.id)}&subject=${encodeURIComponent(subjectId)}`; back.textContent=`Back to ${curriculumSubject.name || pretty(subjectId)}`; list.appendChild(back);
  } else {
    description.textContent=topics.length ? 'Choose a curriculum topic to begin studying.' : 'This subject is connected to the curriculum. Topic content is being populated next.';
    topics.forEach(topic => list.appendChild(card(topic.name, topic.description || 'Open this topic to study the material and practice.', `${subjectUrl}?department=${encodeURIComponent(department.id)}&subject=${encodeURIComponent(subjectId)}&topic=${encodeURIComponent(topic.id)}`, '📚', `${topic.subtopics?.length || 0} subtopics`)));
    const back=document.createElement('a'); back.className='btn btn-secondary'; back.href=`${subjectUrl}?department=${encodeURIComponent(department.id)}`; back.textContent=`Back to ${department.name}`; list.appendChild(back);
  }
} else if (department.subjects && department.subjects.length) {
  label.textContent=`${department.name} · Study`; title.textContent=`${department.name} Subjects`; description.textContent='Choose a subject. Published curriculum will appear inside it.';
  (department.subjects || []).forEach(subject => list.appendChild(card(pretty(typeof subject === 'string' ? subject : subject.id), 'Explore the published curriculum, study material, and practice.', `${subjectUrl}?department=${encodeURIComponent(department.id)}&subject=${encodeURIComponent(typeof subject === 'string' ? subject : subject.id)}`, '📖', 'Topic → Subtopic')));
} else if (curriculumDepartment) {
  label.textContent=`${curriculumDepartment.name} · Study`; title.textContent=curriculumDepartment.name; description.textContent='Curriculum content is being connected.';
} else {
  label.textContent=`${department.name} · Study`; title.textContent=department.name; description.textContent='Curriculum content is being connected.';
}
</script>
