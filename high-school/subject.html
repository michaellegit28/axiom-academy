---
layout: app
title: High School Study
permalink: /high-school/subject/
---

<section class="section-block page-content-start" aria-labelledby="subject-title">
  <div class="section-heading">
    <div>
      <span class="eyebrow" id="department-label">High School · Study</span>
      <h1 id="subject-title">Choose a subject</h1>
      <p id="subject-description">Select a department, then choose a subject to explore its curriculum.</p>
    </div>
    <span class="section-note">Subject → Topic → Subtopic</span>
  </div>
  <div class="track-selector" id="subject-list"></div>
</section>

<script>
const studyDepartments = {{ site.data.learning_taxonomy.high_school.study.departments | jsonify }};
const curriculumDepartments = {{ site.data.high_school_curriculum.departments | jsonify }};
const params = new URLSearchParams(window.location.search);
const departmentId = params.get('department');
const subjectId = params.get('subject');
const topicId = params.get('topic');
const department = studyDepartments.find(item => item.id === departmentId);
const list = document.getElementById('subject-list');
const title = document.getElementById('subject-title');
const label = document.getElementById('department-label');
const description = document.getElementById('subject-description');
const subjectUrl = "{{ '/high-school/subject/' | relative_url }}";
const studyUrl = "{{ '/high-school/' | relative_url }}";
const algebraStudyUrl = "{{ '/high-school/study/mathematics/algebra/' | relative_url }}";
function pretty(value) { return String(value || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
function findCurriculumSubject(id) {
  for (const dept of (curriculumDepartments || [])) {
    const subject = (dept.subjects || []).find(item => item.id === id);
    if (subject) return subject;
  }
  return null;
}
function subjectCard(subject) {
  const id = typeof subject === 'string' ? subject : subject.id;
  const card = document.createElement('a'); card.className='track-card study-subject';
  card.href=`${subjectUrl}?department=${encodeURIComponent(department.id)}&subject=${encodeURIComponent(id)}`;
  card.innerHTML=`<div class="track-icon" aria-hidden="true">📖</div><h2>${pretty(id)}</h2><p>Explore the published curriculum, study material, and practice.</p><div class="track-meta"><span>Topic → Subtopic</span></div>`;
  return card;
}
function subtopicCard(topic, subtopic) {
  const card=document.createElement('a'); card.className='track-card study-subtopic';
  const isAlgebra = subjectId === 'mathematics' && topic.id === 'algebra';
  card.href = isAlgebra ? `${algebraStudyUrl}${subtopic.id}/` : '#';
  if (!isAlgebra) card.setAttribute('aria-disabled','true');
  card.innerHTML=`<div class="track-icon" aria-hidden="true">📘</div><h2>${subtopic.name}</h2><p>${isAlgebra ? 'Study the concept, worked examples, and check-your-understanding questions.' : 'Study content is being prepared for this subtopic.'}</p><div class="track-meta"><span>${isAlgebra ? 'Study available' : 'Coming next'}</span></div>`;
  return card;
}
const curriculumSubject = subjectId ? findCurriculumSubject(subjectId) : null;
if (!department) {
  label.textContent='High School · Study'; title.textContent='Choose a department'; description.textContent='Return to High School Study and choose a department to continue.';
  const back=document.createElement('a'); back.className='btn btn-primary'; back.href=studyUrl; back.textContent='Back to High School Study'; list.appendChild(back);
} else if (subjectId && curriculumSubject) {
  label.textContent=`${department.name} · Study`; title.textContent=pretty(subjectId);
  const topics=curriculumSubject.topics || [];
  const selectedTopic=topics.find(item => item.id === topicId);
  if (selectedTopic) {
    title.textContent=selectedTopic.name;
    description.textContent='Choose a subtopic to begin the study lesson.';
    (selectedTopic.subtopics || []).forEach(subtopic => list.appendChild(subtopicCard(selectedTopic, subtopic)));
    const back=document.createElement('a'); back.className='btn btn-secondary'; back.href=`${subjectUrl}?department=${encodeURIComponent(department.id)}&subject=${encodeURIComponent(subjectId)}`; back.textContent=`Back to ${pretty(subjectId)}`; list.appendChild(back);
  } else {
    description.textContent=topics.length ? 'Choose a curriculum topic to begin studying.' : 'This subject is connected to the curriculum. Topic content is being populated next.';
    topics.forEach(topic => {
      const card=document.createElement('a'); card.className='track-card study-topic';
      card.href=`${subjectUrl}?department=${encodeURIComponent(department.id)}&subject=${encodeURIComponent(subjectId)}&topic=${encodeURIComponent(topic.id)}`;
      card.innerHTML=`<div class="track-icon" aria-hidden="true">📚</div><h2>${topic.name}</h2><p>${topic.description || 'Open this topic to study the material and practice.'}</p><div class="track-meta"><span>${topic.subtopics?.length || 0} subtopics</span></div>`;
      list.appendChild(card);
    });
    const back=document.createElement('a'); back.className='btn btn-secondary'; back.href=`${subjectUrl}?department=${encodeURIComponent(department.id)}`; back.textContent=`Back to ${department.name}`; list.appendChild(back);
  }
} else {
  label.textContent=`${department.name} · Study`; title.textContent=`${department.name} Subjects`; description.textContent='Choose a subject. Published curriculum will appear inside it.'; (department.subjects || []).forEach(subject => list.appendChild(subjectCard(subject)));
}
</script>
