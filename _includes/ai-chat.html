<!-- Enhanced AI Chat — Context-Aware Study Assistant -->
<style>
  .ai-chat-widget { /* styles inherited from app.scss */ }
</style>

<button id="ai-toggle" class="ai-toggle-btn" aria-label="Open Axiom AI">AI</button>

<div id="ai-chat" class="ai-chat-widget" style="display:none;" role="region" aria-label="Axiom AI chat">
  <div class="ai-chat-header">
    <div class="ai-chat-title">🤖 Axiom AI</div>
    <button id="ai-close" class="ai-chat-close" aria-label="Close">✕</button>
  </div>
  <div id="ai-body" class="ai-chat-body" aria-live="polite"></div>
  <div class="ai-chat-input">
    <textarea id="ai-input" placeholder="Ask about this chapter, get a hint, or review a concept..." aria-label="Message"></textarea>
    <button id="ai-send">Send</button>
  </div>
</div>

<script>
(function(){
  const toggle = document.getElementById('ai-toggle');
  const widget = document.getElementById('ai-chat');
  const closeBtn = document.getElementById('ai-close');
  const body = document.getElementById('ai-body');
  const input = document.getElementById('ai-input');
  const send = document.getElementById('ai-send');

  function openWidget(){ widget.style.display='flex'; toggle.style.display='none'; input.focus(); }
  function closeWidget(){ widget.style.display='none'; toggle.style.display='flex'; }
  toggle.addEventListener('click', openWidget);
  closeBtn.addEventListener('click', closeWidget);

  function appendMessage(text, who){
    const d = document.createElement('div'); 
    d.className = 'ai-chat-msg ' + (who==='user' ? 'user' : 'bot');
    d.innerHTML = text; 
    body.appendChild(d); 
    body.scrollTop = body.scrollHeight;
  }

  function setTyping(on){
    let el = document.getElementById('ai-typing');
    if (on){
      if (!el){ 
        el = document.createElement('div'); 
        el.id='ai-typing'; 
        el.className='ai-typing'; 
        el.textContent='Axiom AI is thinking...'; 
        body.appendChild(el); 
        body.scrollTop = body.scrollHeight; 
      }
    } else { 
      if (el) el.remove(); 
    }
  }

  // Get page context for AI
  function getContext(){
    const page = document.body.dataset.page || 'unknown';
    const title = document.querySelector('h1')?.textContent || '';
    const topic = document.querySelector('[data-topic]')?.dataset.topic || '';
    return { page, title, topic, url: window.location.pathname };
  }

  // Local fallback responses
  function localReply(text, context){
    const t = text.trim().toLowerCase();
    if (!t) return "Ask me anything about physics, this chapter, or your study plan.";
    if (t.includes('hint')) return "💡 **Hint:** Break the problem into smaller parts. What quantities are given? What are you solving for? Check your units first.";
    if (t.includes('explain') && context.topic) return "I'd love to explain **" + context.topic + "**! The key idea is to start with the physical picture before writing equations. Would you like the intuition or the derivation?";
    if (t.includes('formula') || t.includes('equation')) return "Here are the key formulas for this topic. Remember: every symbol has a physical meaning. Don't just memorize — derive when you can.";
    if (t.includes('weak') || t.includes('struggle')) return "Based on your quiz history, I recommend reviewing the fundamentals first, then doing 5 practice questions. Shall I generate a focused drill?";
    if (t.includes('jamb') || t.includes('exam')) return "For JAMB, focus on speed + accuracy. Each question averages 1 minute. Master the shortcuts in dimensional analysis — they save precious seconds.";
    if (t.includes('hello') || t.includes('hi')) return "Hello! I'm Axiom AI. I know what you're reading and how you've been performing. Ask me for hints, explanations, or study advice.";
    return "That's a great question. To give you the best answer, I need to connect to my knowledge base. For now, try rephrasing or ask about a specific concept from this chapter.";
  }

  async function handleSend(){
    const text = input.value.trim();
    if (!text) return; 
    input.value=''; 
    appendMessage(text, 'user'); 
    setTyping(true);
    
    const context = getContext();
    
    // Try server first
    try {
      const resp = await fetch('/api/ai-infer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          prompt: text, 
          context: context,
          userId: window.AxiomApp?.user?.uid || 'anonymous'
        })
      });
      if (resp.ok) {
        const data = await resp.json();
        setTyping(false);
        appendMessage(data.reply, 'bot');
        return;
      }
    } catch (err) {
      console.log('Server unavailable, using local AI');
    }
    
    // Fallback
    setTimeout(() => {
      setTyping(false);
      appendMessage(localReply(text, context), 'bot');
    }, 600);
  }

  send.addEventListener('click', handleSend);
  input.addEventListener('keydown', function(e){ 
    if (e.key === 'Enter' && !e.shiftKey){ 
      e.preventDefault(); 
      handleSend(); 
    } 
  });

  // Welcome message
  if (!localStorage.getItem('axiom_ai_seen')){
    const ctx = getContext();
    appendMessage('👋 Hi! I\'m <strong>Axiom AI</strong>. I can explain concepts, give hints without spoiling answers, or analyze your weak topics. What would you like to work on?', 'bot');
    localStorage.setItem('axiom_ai_seen', '1');
  }
})();
</script>
