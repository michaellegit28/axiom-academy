<script>
(function() {
  var root = document.documentElement;
  var saved = localStorage.getItem('axiom-theme');
  if (saved === 'dark') root.setAttribute('data-theme', 'dark');

  var DOMAIN_ROUTES = {
    'University': { study: '{{ "/university/" | relative_url }}', quiz: '{{ "/quiz/" | relative_url }}', progress: '{{ "/profile/analytics/" | relative_url }}' },
    'High School': { study: '{{ "/high-school/" | relative_url }}', quiz: '{{ "/quiz/" | relative_url }}', progress: '{{ "/profile/analytics/" | relative_url }}' },
    'Extras': { study: '{{ "/extras/" | relative_url }}', quiz: '{{ "/quiz/" | relative_url }}', progress: '{{ "/profile/analytics/" | relative_url }}' }
  };

  function applyDomain(name) {
    var label = document.getElementById('nav-domain-label');
    if (label) label.textContent = name;
    var routes = DOMAIN_ROUTES[name] || DOMAIN_ROUTES['High School'];
    var studyLink = document.getElementById('mobile-study-link');
    if (studyLink) studyLink.setAttribute('href', routes.study);
  }

  document.addEventListener('DOMContentLoaded', function() {
    var savedDomain = localStorage.getItem('axiom-domain') || 'High School';
    applyDomain(savedDomain);

    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        var isDark = root.getAttribute('data-theme') === 'dark';
        if (isDark) {
          root.removeAttribute('data-theme');
          localStorage.setItem('axiom-theme', 'light');
        } else {
          root.setAttribute('data-theme', 'dark');
          localStorage.setItem('axiom-theme', 'dark');
        }
      });
    }

    var domainBtn = document.getElementById('nav-domain-btn');
    var domainMenu = document.getElementById('nav-domain-menu');
    if (domainBtn && domainMenu) {
      domainBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = domainMenu.classList.toggle('open');
        domainBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function() {
        domainMenu.classList.remove('open');
        domainBtn.setAttribute('aria-expanded', 'false');
      });
      Array.prototype.forEach.call(domainMenu.querySelectorAll('.nav-domain-item'), function(item) {
        item.addEventListener('click', function() {
          localStorage.setItem('axiom-domain', item.dataset.domain);
        });
      });
    }

    var fab = document.getElementById('ai-fab');
    if (fab) {
      fab.addEventListener('click', function() {
        var widget = document.getElementById('ai-chat-widget') || document.querySelector('.ai-chat-toggle');
        if (widget && widget.click) { widget.click(); }
        else { window.location.hash = '#ai-chat'; }
      });
    }
  });
})();
</script>
