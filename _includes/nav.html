<script>
(function() {
  var root = document.documentElement;
  var saved = localStorage.getItem('axiom-theme');
  if (saved === 'dark') root.setAttribute('data-theme', 'dark');

  document.addEventListener('DOMContentLoaded', function() {
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        var isDark = root.getAttribute('data-theme') === 'dark';
        if (isDark) {
          root.removeAttribute('data-theme');
          localStorage.setItem('axiom-theme', 'light');
        } else {
          root.setAttribute('data-theme', 'dark');
          localStorage.setItem('axiom-theme', 'dark');
        }
      });
    }
    var levelBtn = document.getElementById('nav-level-btn');
    var levelMenu = document.getElementById('nav-level-menu');
    if (levelBtn && levelMenu) {
      levelBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = levelMenu.classList.toggle('open');
        levelBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function() {
        levelMenu.classList.remove('open');
        levelBtn.setAttribute('aria-expanded', 'false');
      });
    }
  });
})();
</script>
