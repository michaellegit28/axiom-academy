<div class="ai-fab" id="ai-fab" title="Ask Axiom AI"><span>🤖</span></div>

<script type="module">
import { getState, setDomain, setActivity, subscribe } from "{{ '/assets/js/axiom-state.js' | relative_url }}";

(function() {
  var root = document.documentElement;
  var domainMeta = {
    university: { label: 'University', study: '{{ "/university/" | relative_url }}' },
    'high-school': { label: 'High School', study: '{{ "/high-school/" | relative_url }}' },
    extras: { label: 'Extras', study: '{{ "/extras/" | relative_url }}' }
  };
  var activityRoutes = {
    study: function(domain) { return domainMeta[domain].study; },
    quiz: function() { return '{{ "/quiz/" | relative_url }}'; },
    progress: function() { return '{{ "/profile/analytics/" | relative_url }}'; }
  };

  function applyState(state) {
    var meta = domainMeta[state.domain] || domainMeta['high-school'];
    var label = document.getElementById('nav-domain-label');
    if (label) label.textContent = meta.label;

    var study = document.getElementById('mobile-study-link');
    var quiz = document.getElementById('mobile-quiz-link');
    var progress = document.getElementById('mobile-progress-link');
    if (study) study.href = activityRoutes.study(state.domain);
    if (quiz) quiz.href = activityRoutes.quiz(state.domain);
    if (progress) progress.href = activityRoutes.progress(state.domain);

    [study, quiz, progress].forEach(function(link) {
      if (link) link.classList.toggle('active', link.dataset.role === state.activity);
    });
  }

  var savedTheme = localStorage.getItem('axiom-theme');
  if (savedTheme === 'dark') root.setAttribute('data-theme', 'dark');

  document.addEventListener('DOMContentLoaded', function() {
    applyState(getState());
    subscribe(applyState);

    var toggle = document.getElementById('theme-toggle');
    if (toggle) toggle.addEventListener('click', function() {
      var dark = root.getAttribute('data-theme') === 'dark';
      root.toggleAttribute('data-theme', !dark);
      localStorage.setItem('axiom-theme', dark ? 'light' : 'dark');
    });

    var domainBtn = document.getElementById('nav-domain-btn');
    var domainMenu = document.getElementById('nav-domain-menu');
    if (domainBtn && domainMenu) {
      domainBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = domainMenu.classList.toggle('open');
        domainBtn.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', function() {
        domainMenu.classList.remove('open');
        domainBtn.setAttribute('aria-expanded', 'false');
      });
      domainMenu.querySelectorAll('.nav-domain-item').forEach(function(item) {
        item.addEventListener('click', function() { setDomain(item.dataset.domain); });
      });
    }

    document.querySelectorAll('[data-role]').forEach(function(link) {
      link.addEventListener('click', function() {
        if (link.dataset.role) setActivity(link.dataset.role);
      });
    });

    var fab = document.getElementById('ai-fab');
    if (fab) fab.addEventListener('click', function() {
      var widget = document.getElementById('ai-chat-widget') || document.querySelector('.ai-chat-toggle');
      if (widget && widget.click) widget.click();
      else window.location.hash = '#ai-chat';
    });
  });
})();
</script>
