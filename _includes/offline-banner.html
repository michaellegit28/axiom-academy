<div id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden>
  <span class="offline-banner-icon" aria-hidden="true">&#9889;</span>
  <span class="offline-banner-text">You're offline. Some features may be unavailable until your connection returns.</span>
</div>
<script>
  (function () {
    var banner = document.getElementById('offline-banner');
    if (!banner) return;
    function update() {
      banner.hidden = navigator.onLine;
    }
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    update();
  })();
</script>
