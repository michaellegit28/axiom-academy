<!-- Auth Modal -->
<div id="auth-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <button class="modal-close" id="auth-modal-close">&times;</button>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Create Account</button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="auth-form">
      <div class="form-group">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary btn-block">Sign In</button>
      <a href="#" class="forgot-link" id="forgot-password">Forgot password?</a>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="auth-form" style="display:none;">
      <div class="form-group">
        <label for="signup-name">Display Name</label>
        <input type="text" id="signup-name" placeholder="e.g. Alex" required>
      </div>
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Min 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-divider">
      <span>or</span>
    </div>

    <button class="btn-google btn-block" id="google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.842 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.836.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.116-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="auth-guest" id="auth-guest-option">
      <p>Or <a href="#" id="continue-anonymous">continue as guest</a></p>
    </div>

    <div class="auth-message" id="auth-message"></div>
  </div>
</div>

<script type="module">
  import { axiomAuth } from "{{ site.baseurl }}/assets/js/auth.js";

  const modal = document.getElementById('auth-modal');
  const closeBtn = document.getElementById('auth-modal-close');
  const tabs = document.querySelectorAll('.auth-tab');
  const signinForm = document.getElementById('signin-form');
  const signupForm = document.getElementById('signup-form');
  const msg = document.getElementById('auth-message');

  function showMessage(text, type = 'error') {
    msg.textContent = text;
    msg.className = 'auth-message ' + type;
    setTimeout(() => { msg.textContent = ''; msg.className = 'auth-message'; }, 5000);
  }

  // Tab switching
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      signinForm.style.display = target === 'signin' ? 'block' : 'none';
      signupForm.style.display = target === 'signup' ? 'block' : 'none';
    });
  });

  // Open / Close
  window.openAuthModal = () => { modal.style.display = 'flex'; };
  window.closeAuthModal = () => { modal.style.display = 'none'; };

  closeBtn.addEventListener('click', closeAuthModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeAuthModal(); });

  // Sign In
  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('signin-email').value;
    const password = document.getElementById('signin-password').value;
    try {
      await axiomAuth.signIn(email, password);
      showMessage('Welcome back!', 'success');
      setTimeout(closeAuthModal, 800);
    } catch (err) {
      showMessage(err.message);
    }
  });

  // Sign Up
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    try {
      await axiomAuth.signUp(email, password, name);
      showMessage('Account created! Welcome to Axiom.', 'success');
      setTimeout(closeAuthModal, 800);
    } catch (err) {
      showMessage(err.message);
    }
  });

  // Google
  document.getElementById('google-signin').addEventListener('click', async () => {
    try {
      await axiomAuth.signInWithGoogle();
      showMessage('Signed in with Google!', 'success');
      setTimeout(closeAuthModal, 800);
    } catch (err) {
      showMessage(err.message);
    }
  });

  // Forgot password
  document.getElementById('forgot-password').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('signin-email').value;
    if (!email) { showMessage('Enter your email first.'); return; }
    try {
      await axiomAuth.resetPassword(email);
      showMessage('Password reset email sent!', 'success');
    } catch (err) {
      showMessage(err.message);
    }
  });

  // Continue anonymous
  document.getElementById('continue-anonymous').addEventListener('click', (e) => {
    e.preventDefault();
    closeAuthModal();
  });
</script>
