<!--
  GNOSTIRI document head.
  Single place where global stylesheets, PWA metadata, SEO tags, and MathJax load.
  Every layout that inherits from app-shell gets this automatically.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Pre-paint theme application: avoids a flash of the wrong theme.
     Dark is the default; a stored preference of "light" opts out. */
  (function () {
    try {
      var stored = localStorage.getItem('gnostiri-theme');
      document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
    } catch (error) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
