questions:
  - id: jamb-mechanics-kin-001
    type: objective
    question: "A car accelerates uniformly from rest to a velocity of 20 m/s in 5 seconds. What is its acceleration?"
    options:
      - "A. 2 m/s²"
      - "B. 4 m/s²"
      - "C. 5 m/s²"
      - "D. 10 m/s²"
    correct: 1
    explanation: "Using v = u + at: 20 = 0 + a(5), therefore a = 4 m/s²."
    topic: kinematics
    year: 2020
    difficulty: easy

  - id: jamb-mechanics-kin-002
    type: objective
    question: "A body is projected vertically upward with an initial velocity of 30 m/s. How long does it take to reach the maximum height? (g = 10 m/s²)"
    options:
      - "A. 1.5 s"
      - "B. 2.0 s"
      - "C. 3.0 s"
      - "D. 6.0 s"
    correct: 2
    explanation: "At maximum height, v = 0. Using v = u - gt: 0 = 30 - 10t, so t = 3 s."
    topic: kinematics
    year: 2021
    difficulty: medium

  - id: jamb-mechanics-kin-003
    type: objective
    question: "The displacement-time graph of a moving body is a straight line inclined to the time axis. This indicates that the body is moving with:"
    options:
      - "A. Uniform velocity"
      - "B. Uniform acceleration"
      - "C. Variable velocity"
      - "D. Variable acceleration"
    correct: 0
    explanation: "A straight-line displacement-time graph indicates uniform (constant) velocity, since the slope (velocity) is constant."
    topic: kinematics
    year: 2019
    difficulty: easy

  - id: jamb-mechanics-kin-004
    type: objective
    question: "A stone is thrown horizontally from the top of a cliff 80 m high with a velocity of 20 m/s. How long does it take to reach the ground? (g = 10 m/s²)"
    options:
      - "A. 2 s"
      - "B. 4 s"
      - "C. 8 s"
      - "D. 16 s"
    correct: 1
    explanation: "For vertical motion: h = ½gt². 80 = ½(10)t², so t² = 16, t = 4 s."
    topic: kinematics
    year: 2022
    difficulty: medium

  - id: jamb-mechanics-kin-005
    type: objective
    question: "Two bodies of masses 2 kg and 4 kg are moving with velocities 3 m/s and 2 m/s respectively in the same direction. If they collide and stick together, what is their common velocity?"
    options:
      - "A. 2.0 m/s"
      - "B. 2.3 m/s"
      - "C. 2.7 m/s"
      - "D. 3.0 m/s"
    correct: 2
    explanation: "By conservation of momentum: (2×3) + (4×2) = (2+4)v. 6 + 8 = 6v, so v = 14/6 ≈ 2.33 m/s."
    topic: dynamics
    year: 2021
    difficulty: hard
