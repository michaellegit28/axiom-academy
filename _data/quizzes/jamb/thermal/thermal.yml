questions:
  - id: jamb-thermal-001
    type: objective
    question: "The absolute zero of temperature is defined as the temperature at which:"
    options:
      - "A. Water freezes"
      - "B. All molecular motion ceases"
      - "C. Ice melts"
      - "D. Water boils"
    correct: 1
    explanation: "Absolute zero (0 K or -273.15°C) is the theoretical temperature at which all molecular motion completely stops."
    topic: thermal_physics
    year: 2020
    difficulty: easy

  - id: jamb-thermal-002
    type: objective
    question: "A gas occupies 500 cm³ at 27°C. What will be its volume at 127°C if pressure is constant?"
    options:
      - "A. 500 cm³"
      - "B. 583 cm³"
      - "C. 667 cm³"
      - "D. 750 cm³"
    correct: 2
    explanation: "Using Charles' Law: V₁/T₁ = V₂/T₂. T must be in Kelvin. 500/300 = V₂/400, so V₂ = 667 cm³."
    topic: thermal_physics
    year: 2021
    difficulty: medium

  - id: jamb-thermal-003
    type: objective
    question: "The specific latent heat of fusion of ice is 336 J/g. How much heat is required to melt 50 g of ice at 0°C?"
    options:
      - "A. 6.72 J"
      - "B. 168 J"
      - "C. 6,720 J"
      - "D. 16,800 J"
    correct: 3
    explanation: "Q = mL = 50 g × 336 J/g = 16,800 J. Note: temperature does not change during phase change."
    topic: thermal_physics
    year: 2022
    difficulty: easy
