# GNOSTIRI assessment model.
# Quiz content belongs to a learning domain and its academic owner.
# Exam boards/tracks are mappings or filters, not replacements for the academic hierarchy.

version: 2

domains:
  high-school:
    ownership: department-subject-topic
    hierarchy: Department → Subject → Topic → Quiz
    exam_contexts:
      - jamb
      - waec
      - international
  university:
    ownership: course-module-topic
    hierarchy: Course → Module → Topic → Assessment
    access: inherits-course-access
  extras:
    ownership: collection-volume-topic
    hierarchy: Collection → Volume → Topic → Assessment

modes:
  - id: topic-practice
    name: Topic Practice
    description: Focused practice for one or more canonical topics.
    requires:
      - domain_id
      - subject_or_course_id
      - topic_ids
    optional:
      - exam_id
      - difficulty
      - question_count
      - timed
    selection: filtered-question-bank

  - id: exam-practice
    name: Exam Practice
    description: Practice a canonical topic through a specific examination context.
    requires:
      - domain_id
      - exam_id
      - subject_id
    optional:
      - topic_ids
      - difficulty
      - question_count
      - timed
    selection: filtered-question-bank
    note: Exam context never changes the canonical High School ownership path.

  - id: weak-areas
    name: Weak Areas
    description: Automatically selects questions from topics where the learner needs practice.
    requires:
      - domain_id
      - subject_or_course_id
    optional:
      - exam_id
      - question_count
      - timed
    selection: mastery-driven

  - id: mixed-practice
    name: Mixed Practice
    description: Samples multiple topics within an academic owner instead of staying on one topic.
    requires:
      - domain_id
      - subject_or_course_id
    optional:
      - exam_id
      - difficulty
      - question_count
      - timed
    selection: balanced-topic-sampling

  - id: timed-drill
    name: Timed Drill
    description: Short, time-bounded practice for exam-speed training.
    requires:
      - domain_id
      - subject_or_course_id
    optional:
      - exam_id
      - topic_ids
      - question_count
      - difficulty
    selection: timed-filtered-question-bank

  - id: revision
    name: Revision
    description: Questions drawn from recently studied or previously assessed material.
    requires:
      - domain_id
      - subject_or_course_id
    optional:
      - exam_id
      - topic_ids
      - question_count
      - timed
    selection: recent-activity

selection_contract:
  question_fields:
    - id
    - domain_id
    - exam_id
    - subject_id
    - course_id
    - topic_ids
    - difficulty
    - type
    - status
  never_fabricate_questions: true
  only_status_live: true

question_taxonomy:
  required:
    - id
    - domain_id
    - topic_ids
  high_school_required:
    - subject_id
  university_required:
    - course_id
  recommended:
    - exam_id
    - skill_ids
    - difficulty
    - year
  note: A question can test multiple canonical topics and multiple skills.

future_adaptive_contract:
  inputs:
    - topic_mastery
    - skill_mastery
    - recent_attempts
    - recent_reading
  outputs:
    - question_ids
    - reason
    - recommended_content_id
