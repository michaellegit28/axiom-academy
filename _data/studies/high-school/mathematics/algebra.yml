version: 1
subject: mathematics
topic: algebra
level: high-school
lessons:
  - id: introduction-to-algebra
    title: Introduction to Algebra
    summary: Algebra uses symbols and rules to represent quantities and relationships.
    objectives:
      - Recognize variables, constants, coefficients, terms and expressions.
      - Translate simple statements into algebraic expressions.
    key_points:
      - A variable represents an unknown or changing quantity.
      - A constant has a fixed value.
      - A coefficient multiplies a variable.
    worked_examples:
      - problem: Write “five more than x” as an expression.
        solution: x + 5
      - problem: Identify the coefficient of 7y.
        solution: 7
    practice:
      - question: Write “three times n minus 4” as an expression.
        answer: 3n - 4

  - id: variables-and-constants
    title: Variables & Constants
    summary: Learn how variables and fixed values behave in algebraic expressions.
    objectives:
      - Distinguish variables from constants.
      - Identify coefficients and terms.
      - Substitute numerical values for variables.
    key_points:
      - In 4x + 9, x is the variable, 4 is the coefficient and 9 is the constant.
      - Substitution means replacing a variable with a known value.
    worked_examples:
      - problem: Evaluate 4x + 9 when x = 3.
        solution: 21
      - problem: Identify the terms in 5a - 2b + 7.
        solution: 5a, -2b and 7
    practice:
      - question: Evaluate 2m + 5 when m = 6.
        answer: 17

  - id: algebraic-expressions
    title: Algebraic Expressions
    summary: Build and interpret expressions from mathematical statements.
    objectives:
      - Identify terms and coefficients.
      - Translate words into expressions.
      - Evaluate expressions by substitution.
    key_points:
      - Terms are separated by addition or subtraction.
      - Multiplication is often written without a multiplication sign, such as 3x.
    worked_examples:
      - problem: Translate “twice a number plus seven” into an expression.
        solution: 2x + 7
      - problem: Evaluate 3x - 2 when x = 5.
        solution: 13
    practice:
      - question: Evaluate 5p + 1 when p = 4.
        answer: 21

  - id: simplifying-expressions
    title: Simplifying Expressions
    summary: Combine like terms and use the distributive property to write equivalent expressions.
    objectives:
      - Identify like terms.
      - Combine like terms.
      - Expand simple brackets using distribution.
    key_points:
      - Like terms have the same variable parts and exponents.
      - Only like terms can be combined.
      - a(b + c) = ab + ac.
    worked_examples:
      - problem: Simplify 3x + 5x - 2.
        solution: 8x - 2
      - problem: Expand 4(x + 3).
        solution: 4x + 12
    practice:
      - question: Simplify 7y - 2y + 6.
        answer: 5y + 6

  - id: linear-equations
    title: Linear Equations
    summary: Solve equations by maintaining equality while isolating the unknown.
    objectives:
      - Use inverse operations to solve simple linear equations.
      - Check solutions by substitution.
    key_points:
      - Whatever operation is applied to one side must also be applied to the other.
      - Addition and subtraction are inverse operations; multiplication and division are inverse operations.
    worked_examples:
      - problem: Solve x + 7 = 12.
        solution: x = 5
      - problem: Solve 3x = 18.
        solution: x = 6
      - problem: Solve 2x + 4 = 14.
        solution: x = 5
    practice:
      - question: Solve 5x - 3 = 17.
        answer: x = 4

  - id: inequalities
    title: Inequalities
    summary: Represent and solve relationships where one quantity is greater or less than another.
    objectives:
      - Interpret inequality symbols.
      - Solve simple linear inequalities.
      - Recognize that multiplying or dividing by a negative reverses the inequality sign.
    key_points:
      - < means less than; > means greater than; ≤ means less than or equal to; ≥ means greater than or equal to.
      - Multiplying or dividing an inequality by a negative number reverses its direction.
    worked_examples:
      - problem: Solve x + 3 > 8.
        solution: x > 5
      - problem: Solve -2x < 10.
        solution: x > -5
    practice:
      - question: Solve 2x + 1 ≤ 9.
        answer: x ≤ 4
