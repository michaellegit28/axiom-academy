subject: mathematics
topic: algebra
level: high-school
version: 1

subtopics:
  - id: introduction-to-algebra
    title: Introduction to Algebra
    objective: Understand algebra as a language for representing unknowns and relationships.
    lessons:
      - title: What is Algebra?
        content: Algebra uses symbols, numbers and operations to describe quantities and relationships. A letter can represent a value that is unknown or can vary.
      - title: Algebraic language
        content: Learn the meaning of variable, constant, coefficient, term and expression. Read expressions from left to right and identify their parts.
      - title: Worked example
        example: If x represents the number of books and 3 more books are added, the new number is x + 3.
    review:
      - Define a variable.
      - What is a constant?
      - Identify the variable and constant in x + 7.

  - id: variables-and-constants
    title: Variables & Constants
    objective: Distinguish quantities that vary from fixed numerical values.
    lessons:
      - title: Variables
        content: A variable is a symbol, commonly a letter, whose value may be unknown or may change.
      - title: Constants
        content: A constant is a fixed value. In 4x + 9, 9 is a constant and 4 is the coefficient of x.
      - title: Worked example
        example: In 7y - 5, y is the variable, 7 is the coefficient and -5 is the constant.
    review:
      - Identify the variable in 3a + 8.
      - Identify the coefficient in 12m.
      - Identify the constant in 5p - 11.

  - id: algebraic-expressions
    title: Algebraic Expressions
    objective: Read, write and evaluate algebraic expressions.
    lessons:
      - title: Terms and expressions
        content: A term is a number, variable, or product of numbers and variables. An expression is a combination of terms connected by operations.
      - title: Translating words into algebra
        content: Convert phrases into expressions. For example, five more than n is n + 5, while three times n is 3n.
      - title: Evaluating an expression
        content: Substitute the given value for the variable, then follow the order of operations.
      - title: Worked example
        example: For 2x + 3 when x = 4, substitute 4 to obtain 2(4) + 3 = 11.
    review:
      - Write an expression for twice a number plus 6.
      - Evaluate 3x + 2 when x = 5.

  - id: simplifying-expressions
    title: Simplifying Expressions
    objective: Combine like terms and use the distributive property correctly.
    lessons:
      - title: Like terms
        content: Like terms have the same variable parts with the same exponents. Their coefficients can be combined.
      - title: Combining like terms
        example: 3x + 5x = 8x. The variable part remains x while the coefficients are added.
      - title: Distributive property
        content: Multiply a factor outside parentheses by every term inside: a(b + c) = ab + ac.
      - title: Worked example
        example: 2(x + 4) + 3x simplifies to 2x + 8 + 3x, then 5x + 8.
    review:
      - Simplify 4x + 7x - 2.
      - Expand 3(x + 5).

  - id: linear-equations
    title: Linear Equations
    objective: Solve one-variable linear equations and check solutions.
    lessons:
      - title: Equality and balance
        content: An equation states that two expressions are equal. Any operation applied to one side must also be applied to the other to preserve equality.
      - title: One-step equations
        example: x + 6 = 14 gives x = 8 after subtracting 6 from both sides.
      - title: Multi-step equations
        content: Simplify each side, collect variable terms, then isolate the variable using inverse operations.
      - title: Checking a solution
        content: Substitute the proposed value back into the original equation. Both sides should have the same value.
      - title: Worked example
        example: 3x + 4 = 19. Subtract 4 to get 3x = 15, then divide by 3 to get x = 5.
    review:
      - Solve x - 9 = 4.
      - Solve 5x = 35.
      - Solve 2x + 7 = 21.

  - id: inequalities
    title: Inequalities
    objective: Represent and solve basic linear inequalities.
    lessons:
      - title: Inequality symbols
        content: < means less than, > means greater than, ≤ means less than or equal to, and ≥ means greater than or equal to.
      - title: Solving inequalities
        content: Solve inequalities using inverse operations as with equations. When multiplying or dividing both sides by a negative number, reverse the inequality sign.
      - title: Number-line interpretation
        content: Solutions to an inequality form a set of values. Use an open endpoint for a strict inequality and a closed endpoint when equality is included.
      - title: Worked example
        example: x + 3 > 8 gives x > 5.
    review:
      - Solve x - 4 ≤ 7.
      - Solve 2x > 10.
      - What happens to the inequality sign when both sides are divided by -2?
