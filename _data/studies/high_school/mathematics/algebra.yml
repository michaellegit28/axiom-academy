version: 1
domain: high-school
department: sciences
subject: mathematics
topic: algebra
level: high-school
status: live

subtopics:
  - id: introduction-to-algebra
    title: Introduction to Algebra
    objectives:
      - Understand algebra as a language for representing quantities and relationships.
      - Distinguish constants, variables, coefficients, terms and expressions.
    study:
      sections:
        - title: What algebra does
          content: Algebra uses symbols and rules to describe unknown or changing quantities and relationships. A variable represents a quantity whose value may be unknown or may change.
        - title: Core vocabulary
          content: A constant has a fixed value. A variable represents a value. A coefficient multiplies a variable. A term is a number, variable, or product of numbers and variables. An expression combines terms using operations.
        - title: Example
          content: In 3x + 5, x is the variable, 3 is the coefficient, 5 is the constant, and 3x and 5 are the terms.
      key_points:
        - Algebra represents relationships using symbols.
        - Expressions do not contain an equality sign; equations do.
    practice_focus:
      - Identify parts of algebraic expressions.
      - Translate simple verbal statements into expressions.

  - id: variables-and-constants
    title: Variables & Constants
    objectives:
      - Identify variables and constants in expressions.
      - Substitute numerical values for variables correctly.
    study:
      sections:
        - title: Variables
          content: A variable is a symbol, commonly a letter, used to represent a quantity. Its value can be unknown or can vary.
        - title: Constants
          content: A constant is a fixed numerical value. In an expression such as 4x - 7, the number 7 is a constant.
        - title: Substitution
          content: To evaluate an expression, replace each variable with its given value and follow the order of operations.
        - title: Worked example
          content: If x = 3, then 2x + 5 = 2(3) + 5 = 11.
      key_points:
        - Always use parentheses when substituting a value into a product or power.
        - Follow the order of operations after substitution.
    practice_focus:
      - Classify variables and constants.
      - Evaluate expressions for given variable values.

  - id: algebraic-expressions
    title: Algebraic Expressions
    objectives:
      - Recognize terms, coefficients and like terms.
      - Translate simple word statements into algebraic expressions.
    study:
      sections:
        - title: Terms and coefficients
          content: Terms are separated by addition or subtraction. In 5x, 5 is the coefficient of x. In 5x + 2y - 7 there are three terms.
        - title: Like terms
          content: Like terms have the same variable parts with the same exponents. For example, 3x and -5x are like terms, while 3x and 3x² are not.
        - title: Translating words
          content: The phrase 'five more than twice x' can be represented by 2x + 5.
        - title: Worked example
          content: 'Three times a number n decreased by 4 is represented by 3n - 4.'
      key_points:
        - Only like terms can be combined by addition or subtraction.
        - Preserve the meaning of the original statement when translating words into symbols.
    practice_focus:
      - Identify like and unlike terms.
      - Translate verbal descriptions into expressions.

  - id: simplifying-expressions
    title: Simplifying Expressions
    objectives:
      - Combine like terms.
      - Use the distributive property to remove brackets.
    study:
      sections:
        - title: Combining like terms
          content: Add or subtract the coefficients of like terms while keeping the common variable part. For example, 3x + 5x = 8x.
        - title: Distributive property
          content: Multiplication distributes across a sum or difference: a(b + c) = ab + ac and a(b - c) = ab - ac.
        - title: Worked example
          content: 3(x + 4) + 2x simplifies to 3x + 12 + 2x, then to 5x + 12.
        - title: Signs and negatives
          content: When distributing a negative factor, each term inside the brackets changes sign appropriately.
      key_points:
        - Combine only like terms.
        - Apply distribution to every term inside the brackets.
    practice_focus:
      - Simplify expressions with like terms.
      - Expand and simplify expressions containing brackets.

  - id: linear-equations
    title: Linear Equations
    objectives:
      - Understand an equation as a statement that two expressions are equal.
      - Solve one-variable linear equations using inverse operations.
      - Check solutions by substitution.
    study:
      sections:
        - title: Equality and balance
          content: An equation states that two expressions have the same value. Solving means finding values that make the equation true.
        - title: Inverse operations
          content: Use inverse operations to isolate the variable. Addition is undone by subtraction, multiplication by division, and so on.
        - title: Worked example
          content: For 3x + 5 = 20, subtract 5 from both sides to get 3x = 15, then divide both sides by 3 to obtain x = 5.
        - title: Checking
          content: Substitute the solution into the original equation. For x = 5, 3(5) + 5 = 20, so the solution is correct.
      key_points:
        - Perform the same valid operation on both sides of an equation.
        - Check the final answer in the original equation.
    practice_focus:
      - Solve one-step and multi-step linear equations.
      - Check solutions by substitution.

  - id: inequalities
    title: Inequalities
    objectives:
      - Interpret inequality symbols.
      - Solve simple linear inequalities.
      - Understand why multiplying or dividing by a negative reverses the inequality sign.
    study:
      sections:
        - title: Inequality symbols
          content: The symbols <, >, ≤ and ≥ compare quantities. An inequality can describe a range of possible values rather than one exact value.
        - title: Solving inequalities
          content: Solve inequalities using the same balancing principles used for equations.
        - title: The sign-reversal rule
          content: When both sides of an inequality are multiplied or divided by a negative number, reverse the inequality sign.
        - title: Worked example
          content: From -2x > 6, dividing both sides by -2 gives x < -3 because the inequality reverses.
      key_points:
        - An inequality can have many solutions.
        - Reverse the sign when multiplying or dividing by a negative quantity.
    practice_focus:
      - Solve and represent linear inequalities.
      - Interpret solution sets in context.
