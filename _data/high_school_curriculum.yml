# Canonical High School Study taxonomy.
# Stable IDs are referenced by content front matter and UI; display names may change.
# Exam mappings are intentionally separate from Study taxonomy.

version: 4
domain: high-school

departments:
  - id: mathematics
    name: Mathematics
    description: A comprehensive global-core high school mathematics curriculum.
    subjects:
      - id: number-and-numeracy
        name: Number & Numeracy
        description: Number systems, arithmetic, ratios, powers, roots, approximation and accuracy.
        subtopics:
          - id: number-systems
            name: Number Systems
          - id: integers
            name: Integers
          - id: fractions
            name: Fractions
          - id: decimals
            name: Decimals
          - id: percentages
            name: Percentages
          - id: ratios
            name: Ratios
          - id: proportions
            name: Proportions
          - id: rates-and-unit-rates
            name: Rates and Unit Rates
          - id: factors-and-multiples
            name: Factors and Multiples
          - id: prime-numbers
            name: Prime Numbers
          - id: hcf-and-lcm
            name: HCF and LCM
          - id: powers-and-exponents
            name: Powers and Exponents
          - id: roots-and-radicals
            name: Roots and Radicals
          - id: standard-form
            name: Standard Form / Scientific Notation
          - id: approximation-and-estimation
            name: Approximation and Estimation
          - id: significant-figures
            name: Significant Figures
          - id: decimal-places
            name: Decimal Places
          - id: bounds-and-accuracy
            name: Bounds and Limits of Accuracy
          - id: surds
            name: Surds
          - id: recurring-decimals
            name: Recurring Decimals
      - id: algebra
        name: Algebra
        description: Variables, expressions, equations, inequalities, sequences and algebraic relationships.
        subtopics:
          - id: introduction-to-algebra
            name: Introduction to Algebra
          - id: variables-and-constants
            name: Variables & Constants
          - id: algebraic-expressions
            name: Algebraic Expressions
          - id: simplifying-expressions
            name: Simplifying Expressions
          - id: substitution
            name: Substitution
          - id: expanding-brackets
            name: Expanding Brackets
          - id: factorisation
            name: Factorisation
          - id: algebraic-fractions
            name: Algebraic Fractions
          - id: linear-equations
            name: Linear Equations
          - id: simultaneous-equations
            name: Simultaneous Equations
          - id: inequalities
            name: Inequalities
          - id: quadratic-expressions
            name: Quadratic Expressions
          - id: quadratic-equations
            name: Quadratic Equations
          - id: completing-the-square
            name: Completing the Square
          - id: algebraic-manipulation
            name: Algebraic Manipulation
          - id: sequences
            name: Sequences
          - id: arithmetic-sequences
            name: Arithmetic Sequences
          - id: geometric-sequences
            name: Geometric Sequences
          - id: variation
            name: Variation
          - id: mathematical-modelling
            name: Mathematical Modelling
      - id: functions-and-graphs
        name: Functions & Graphs
        description: Functions, graphs, transformations, inverse functions and graphical solutions.
        subtopics: []
      - id: coordinate-geometry
        name: Coordinate Geometry
        description: Coordinates, straight lines, distance, midpoint, gradient and coordinate proofs.
        subtopics: []
      - id: geometry
        name: Geometry
        description: Angles, triangles, polygons, circles, constructions, loci and geometric proof.
        subtopics: []
      - id: mensuration
        name: Mensuration
        description: Measurement, perimeter, area, surface area, volume and composite solids.
        subtopics: []
      - id: trigonometry
        name: Trigonometry
        description: Triangle relationships, trigonometric ratios, identities and applications.
        subtopics: []
      - id: vectors-and-transformations
        name: Vectors & Transformations
        description: Vectors, transformations and their geometric applications.
        subtopics: []
      - id: statistics
        name: Statistics
        description: Data collection, presentation, averages, spread, correlation and interpretation.
        subtopics: []
      - id: probability
        name: Probability
        description: Events, outcomes, probability rules, conditional probability and distributions.
        subtopics: []
      - id: financial-and-commercial-mathematics
        name: Financial & Commercial Mathematics
        description: Practical mathematics for money, commerce, finance and decision-making.
        subtopics: []
      - id: mathematical-reasoning-and-problem-solving
        name: Mathematical Reasoning & Problem Solving
        description: Reasoning, proof, modelling and strategies for solving unfamiliar problems.
        subtopics: []
      - id: calculus-and-introductory-advanced-mathematics
        name: Calculus & Introductory Advanced Mathematics
        description: Introductory calculus, sequences, series, binomial expansion and advanced functions.
        subtopics: []
      - id: discrete-mathematics-sets-and-logic
        name: Discrete Mathematics, Sets & Logic
        description: Sets, logic, counting, algorithms, networks and introductory discrete mathematics.
        subtopics: []

  - id: sciences
    name: Sciences
    description: Physics and the core science subjects.
    subjects:
      - id: physics
        name: Physics
        description: Mechanics, waves, electricity, fields and modern physics.
        topics: []

  - id: commercial
    name: Commercial
    description: Commerce, accounting, economics and related subjects.
    subjects: []

  - id: arts
    name: Arts
    description: Arts and humanities subjects.
    subjects: []

  - id: technology
    name: Technology
    description: Computing, technical and applied subjects.
    subjects: []
