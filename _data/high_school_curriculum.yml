# Canonical High School Study taxonomy.
# Stable IDs are referenced by content front matter and UI; display names may change.
# Exam mappings are intentionally separate from Study taxonomy.

version: 2

domain: high-school

departments:
  - id: mathematics
    name: Mathematics
    description: A comprehensive global-core high school mathematics curriculum.
    subjects:
      - id: number-and-numeracy
        name: Number & Numeracy
        description: Number systems, arithmetic, ratios, powers, roots, approximation and accuracy.
        topics:
          - id: number-systems
            name: Number Systems
            subtopics: [Natural Numbers, Integers, Rational Numbers, Irrational Numbers, Real Numbers, Number Lines]
          - id: fractions-decimals-and-percentages
            name: Fractions, Decimals & Percentages
            subtopics: [Fractions, Decimal Operations, Percentages, Percentage Change, Recurring Decimals]
          - id: ratio-proportion-and-rates
            name: Ratio, Proportion & Rates
            subtopics: [Ratios, Direct Proportion, Inverse Proportion, Rates, Unit Rates, Scale]
          - id: factors-multiples-and-primes
            name: Factors, Multiples & Primes
            subtopics: [Factors, Multiples, Prime Numbers, HCF, LCM, Prime Factorisation]
          - id: powers-roots-and-surds
            name: Powers, Roots & Surds
            subtopics: [Indices, Laws of Indices, Square Roots, Cube Roots, Fractional Indices, Surds]
          - id: approximation-and-accuracy
            name: Approximation & Accuracy
            subtopics: [Estimation, Decimal Places, Significant Figures, Bounds, Limits of Accuracy]
          - id: standard-form
            name: Standard Form
            subtopics: [Scientific Notation, Converting Standard Form, Calculations in Standard Form]
      - id: algebra
        name: Algebra
        description: Variables, expressions, equations, inequalities, sequences and algebraic relationships.
        topics:
          - id: introduction-to-algebra
            name: Introduction to Algebra
          - id: variables-and-constants
            name: Variables & Constants
          - id: algebraic-expressions
            name: Algebraic Expressions
          - id: simplifying-expressions
            name: Simplifying Expressions
          - id: substitution
            name: Substitution
          - id: expanding-brackets
            name: Expanding Brackets
          - id: factorisation
            name: Factorisation
          - id: algebraic-fractions
            name: Algebraic Fractions
          - id: linear-equations
            name: Linear Equations
          - id: simultaneous-equations
            name: Simultaneous Equations
          - id: inequalities
            name: Inequalities
          - id: quadratic-expressions
            name: Quadratic Expressions
          - id: quadratic-equations
            name: Quadratic Equations
          - id: completing-the-square
            name: Completing the Square
          - id: algebraic-manipulation
            name: Algebraic Manipulation
          - id: sequences
            name: Sequences
          - id: arithmetic-sequences
            name: Arithmetic Sequences
          - id: geometric-sequences
            name: Geometric Sequences
          - id: variation
            name: Variation
          - id: mathematical-modelling
            name: Mathematical Modelling
      - id: functions-and-graphs
        name: Functions & Graphs
        description: Functions, graphs, transformations, inverse functions and graphical solutions.
        topics:
          - id: introduction-to-functions
            name: Introduction to Functions
            subtopics: [Function Language, Inputs and Outputs, Function Machines]
          - id: function-notation
            name: Function Notation
            subtopics: [Notation, Evaluating Functions, Composite Notation]
          - id: domain-and-range
            name: Domain & Range
            subtopics: [Domain, Range, Restrictions]
          - id: linear-functions
            name: Linear Functions
            subtopics: [Linear Graphs, Gradient, Intercepts, Applications]
          - id: quadratic-functions
            name: Quadratic Functions
            subtopics: [Parabolas, Roots, Turning Points, Graph Interpretation]
          - id: polynomial-functions
            name: Polynomial Functions
            subtopics: [Polynomial Form, Degree, Roots, Graphs]
          - id: reciprocal-functions
            name: Reciprocal Functions
            subtopics: [Reciprocal Graphs, Asymptotes, Transformations]
          - id: exponential-functions
            name: Exponential Functions
            subtopics: [Growth, Decay, Exponential Graphs, Applications]
          - id: graph-transformations
            name: Graph Transformations
            subtopics: [Translations, Reflections, Stretches, Combined Transformations]
          - id: composite-and-inverse-functions
            name: Composite & Inverse Functions
            subtopics: [Composite Functions, Inverse Functions, Graphical Relationships]
          - id: graphical-solutions
            name: Graphical Solutions
            subtopics: [Intersections, Approximate Solutions, Graphical Inequalities]
      - id: coordinate-geometry
        name: Coordinate Geometry
        description: Coordinates, straight lines, distance, midpoint, gradient and coordinate proofs.
        topics:
          - id: cartesian-coordinates
            name: Cartesian Coordinates
            subtopics: [Coordinate Plane, Plotting Points, Quadrants]
          - id: distance-and-midpoint
            name: Distance & Midpoint
            subtopics: [Distance Formula, Midpoint Formula, Applications]
          - id: gradient
            name: Gradient
            subtopics: [Gradient Calculation, Positive and Negative Gradient, Rate of Change]
          - id: equations-of-lines
            name: Equations of Straight Lines
            subtopics: [Slope-Intercept Form, Point-Slope Form, Intercepts]
          - id: parallel-and-perpendicular-lines
            name: Parallel & Perpendicular Lines
            subtopics: [Parallel Lines, Perpendicular Gradients, Applications]
          - id: intersections-and-proofs
            name: Intersections & Coordinate Proofs
            subtopics: [Line Intersections, Geometric Proofs, Collinearity]
          - id: circles-in-coordinate-geometry
            name: Circles in Coordinate Geometry
            subtopics: [Circle Equations, Centre and Radius, Tangents]
      - id: geometry
        name: Geometry
        description: Angles, triangles, polygons, circles, constructions, loci and geometric proof.
        topics:
          - id: geometric-language
            name: Geometric Language
            subtopics: [Points, Lines, Rays, Segments, Planes]
          - id: angles-and-parallel-lines
            name: Angles & Parallel Lines
            subtopics: [Angle Types, Angle Rules, Parallel Lines, Transversals]
          - id: triangles
            name: Triangles
            subtopics: [Triangle Properties, Congruence, Similarity, Triangle Proof]
          - id: polygons-and-quadrilaterals
            name: Polygons & Quadrilaterals
            subtopics: [Polygon Properties, Interior Angles, Quadrilaterals, Regular Polygons]
          - id: circles
            name: Circles
            subtopics: [Circle Parts, Chords, Arcs, Tangents]
          - id: circle-theorems
            name: Circle Theorems
            subtopics: [Angles in a Circle, Cyclic Quadrilaterals, Tangent Theorems]
          - id: constructions
            name: Geometric Constructions
            subtopics: [Perpendicular Bisectors, Angle Bisectors, Triangle Construction]
          - id: loci
            name: Loci
            subtopics: [Distance Loci, Combined Loci, Construction of Loci]
          - id: symmetry
            name: Symmetry
            subtopics: [Line Symmetry, Rotational Symmetry, Symmetry in Shapes]
          - id: geometric-proof
            name: Geometric Proof
            subtopics: [Statements and Reasons, Congruence Proofs, Similarity Proofs]
      - id: mensuration
        name: Mensuration
        description: Measurement, perimeter, area, surface area, volume and composite solids.
        topics:
          - id: units-and-measurement
            name: Units & Measurement
            subtopics: [Metric Units, Unit Conversion, Measurement Accuracy]
          - id: perimeter-and-area
            name: Perimeter & Area
            subtopics: [Perimeter, Rectangle Area, Triangle Area, Circle Area]
          - id: compound-areas
            name: Compound Areas
            subtopics: [Composite Shapes, Missing Dimensions, Real-World Areas]
          - id: surface-area
            name: Surface Area
            subtopics: [Prisms, Cylinders, Pyramids, Cones, Spheres]
          - id: volume
            name: Volume
            subtopics: [Prisms, Cylinders, Pyramids, Cones, Spheres]
          - id: composite-solids
            name: Composite Solids
            subtopics: [Decomposing Solids, Combined Volumes, Combined Surface Areas]
          - id: scale-and-similarity
            name: Scale & Similarity
            subtopics: [Scale Drawings, Similar Figures, Scale Factors]
      - id: trigonometry
