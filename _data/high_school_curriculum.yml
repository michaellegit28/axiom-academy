# Canonical High School Study taxonomy.
# Stable IDs are referenced by content front matter and UI; display names may change.
# Exam mappings are intentionally separate from Study taxonomy.

version: 1

domain: high-school

departments:
  - id: sciences
    name: Sciences
    description: Mathematics and the core science subjects.
    subjects:
      - id: mathematics
        name: Mathematics
        description: Algebra, geometry, trigonometry, statistics, probability and introductory calculus.
        topics:
          - id: algebra
            name: Algebra
            description: Variables, expressions, equations, inequalities and algebraic relationships.
            subtopics:
              - id: introduction-to-algebra
                name: Introduction to Algebra
              - id: variables-and-constants
                name: Variables & Constants
              - id: algebraic-expressions
                name: Algebraic Expressions
              - id: simplifying-expressions
                name: Simplifying Expressions
              - id: linear-equations
                name: Linear Equations
              - id: inequalities
                name: Inequalities
          - id: geometry
            name: Geometry
            description: Shapes, angles, measurement, coordinate geometry and geometric relationships.
            subtopics:
              - id: angles-and-lines
                name: Angles & Lines
              - id: triangles
                name: Triangles
              - id: quadrilaterals-and-polygons
                name: Quadrilaterals & Polygons
              - id: circles
                name: Circles
              - id: area-and-perimeter
                name: Area & Perimeter
              - id: coordinate-geometry
                name: Coordinate Geometry
          - id: trigonometry
            name: Trigonometry
            description: Right-triangle relationships, trigonometric ratios, identities and applications.
            subtopics:
              - id: trigonometric-ratios
                name: Trigonometric Ratios
              - id: right-triangles
                name: Right Triangles
              - id: angles-of-elevation-and-depression
                name: Angles of Elevation & Depression
              - id: sine-and-cosine-rules
                name: Sine & Cosine Rules
              - id: trigonometric-identities
                name: Trigonometric Identities
          - id: statistics
            name: Statistics
            description: Data collection, presentation, averages, spread and interpretation.
            subtopics:
              - id: data-collection
                name: Data Collection
              - id: tables-and-charts
                name: Tables & Charts
              - id: mean-median-and-mode
                name: Mean, Median & Mode
              - id: range-and-variation
                name: Range & Variation
              - id: data-interpretation
                name: Data Interpretation
          - id: probability
            name: Probability
            description: Events, outcomes, probability rules and basic probability models.
            subtopics:
              - id: probability-basics
                name: Probability Basics
              - id: sample-spaces
                name: Sample Spaces
              - id: events
                name: Events
              - id: probability-rules
                name: Probability Rules
          - id: calculus-basics
            name: Calculus Basics
            description: Introductory limits, differentiation and applications.
            subtopics:
              - id: introduction-to-limits
                name: Introduction to Limits
              - id: basic-differentiation
                name: Basic Differentiation
              - id: applications-of-differentiation
                name: Applications of Differentiation

      - id: physics
        name: Physics
        description: Mechanics, waves, electricity, fields and modern physics.
        topics:
          - id: mechanics
            name: Mechanics
            description: Motion, forces, energy, momentum and related principles.
            subtopics:
              - id: measurements-and-units
                name: Measurements & Units
              - id: motion-in-one-dimension
                name: Motion in One Dimension
              - id: forces-and-newtons-laws
                name: Forces & Newton's Laws
              - id: work-energy-and-power
                name: Work, Energy & Power
              - id: momentum-and-collisions
                name: Momentum & Collisions
          - id: waves
            name: Waves
            description: Wave motion, sound, light and wave phenomena.
            subtopics:
              - id: wave-motion
                name: Wave Motion
              - id: sound
                name: Sound
              - id: light
                name: Light
          - id: electricity
            name: Electricity
            description: Current electricity, circuits and electromagnetic effects.
            subtopics:
              - id: current-electricity
                name: Current Electricity
              - id: electric-circuits
                name: Electric Circuits
              - id: electromagnetism
                name: Electromagnetism

  - id: commercial
    name: Commercial
    description: Commerce, accounting, economics and related subjects.
    subjects: []

  - id: arts
    name: Arts
    description: Arts and humanities subjects.
    subjects: []

  - id: technology
    name: Technology
    description: Computing, technical and applied subjects.
    subjects: []
