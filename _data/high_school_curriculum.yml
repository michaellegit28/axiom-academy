            subtopics: [SOHCAHTOA, Finding Sides, Finding Angles]
          - id: bearings-and-applications
            name: Bearings & Applications
            subtopics: [Three-Figure Bearings, Navigation, Elevation and Depression]
          - id: sine-rule
            name: Sine Rule
            subtopics: [Sine Rule, Ambiguous Case, Applications]
          - id: cosine-rule
            name: Cosine Rule
            subtopics: [Cosine Rule, Finding Sides, Finding Angles]
          - id: area-of-a-triangle
            name: Area of a Triangle
            subtopics: [Half-ab Sin-C, Triangle Area Applications]
          - id: trigonometric-graphs
            name: Trigonometric Graphs
            subtopics: [Sine Graph, Cosine Graph, Tangent Graph, Transformations]
          - id: trigonometric-identities
            name: Trigonometric Identities
            subtopics: [Basic Identities, Simplification, Identity Proofs]
          - id: trigonometric-equations
            name: Trigonometric Equations
            subtopics: [Solving Basic Equations, General Solutions, Applications]
      - id: vectors-and-transformations
        name: Vectors & Transformations
        description: Vectors, transformations and their geometric applications.
        topics:
          - id: vector-notation
            name: Vector Notation
            subtopics: [Vector Symbols, Column Vectors, Magnitude]
          - id: vector-operations
            name: Vector Operations
            subtopics: [Addition, Subtraction, Scalar Multiplication]
          - id: position-vectors
            name: Position Vectors
            subtopics: [Position Vectors, Displacement, Vector Geometry]
          - id: vector-geometry
            name: Vector Geometry
            subtopics: [Parallel Vectors, Collinearity, Geometric Proofs]
          - id: transformations
            name: Transformations
            subtopics: [Translation, Reflection, Rotation, Enlargement]
          - id: combined-transformations
            name: Combined Transformations
            subtopics: [Multiple Transformations, Transformation Descriptions]
          - id: matrix-transformations
            name: Matrix Transformations
            subtopics: [Transformation Matrices, Matrix Mapping, Applications]
      - id: statistics
        name: Statistics
        description: Data collection, presentation, averages, spread, correlation and interpretation.
        topics:
          - id: data-and-variables
            name: Data & Variables
            subtopics: [Qualitative Data, Quantitative Data, Discrete Data, Continuous Data]
          - id: sampling
            name: Sampling
