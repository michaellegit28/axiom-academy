- id: hs-math-numsys-001
  exam: axiom
  subject: Mathematics
  topic: number-systems
  difficulty: easy
  type: multiple_choice
  question: "Which set contains -3, 0 and 5/2?"
  options: ["Natural numbers", "Integers", "Rational numbers", "Irrational numbers"]
  answer: C
  answer_index: 2
  explanation: "All three numbers can be written as a ratio of integers, so they are rational numbers."
