  exam: axiom
  subject: Mathematics
  topic: number-systems
  difficulty: medium
  type: multiple_choice
  question: "Which statement about √2 is correct?"
  options: ["It is an integer", "It is rational", "It is irrational and real", "It is non-real"]
  answer: C
  answer_index: 2
  explanation: "√2 cannot be written as a ratio of integers, so it is irrational; it is still a real number."
