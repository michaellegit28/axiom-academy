name: Build and Deploy Jekyll site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Verify generated content index
        run: |
          test -f _site/content-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('_site/content-index.json').read_text())
          assert isinstance(data, list), 'content-index.json must be a JSON array'
          for item in data:
              assert item.get('contentId'), 'indexed item missing contentId'
              assert item.get('domain'), 'indexed item missing domain'
              assert item.get('contentType'), 'indexed item missing contentType'
              assert item.get('title'), 'indexed item missing title'
              assert item.get('url'), 'indexed item missing url'
          print(f'Validated {len(data)} indexed content items.')
          PY

      - name: Verify High School curriculum renderer inputs
        run: |
          test -f _site/high-school/subject/index.html
          grep -q 'curriculumDepartments' _site/high-school/subject/index.html
          grep -q 'Mathematics' _site/high-school/subject/index.html
          grep -q 'Algebra' _site/high-school/subject/index.html
          grep -q 'number-and-numeracy' _site/high-school/subject/index.html

      - name: Verify all Number & Numeracy study pages
        run: |
          for slug in \
            number-systems integers fractions decimals percentages ratios proportions \
            rates-and-unit-rates factors-and-multiples prime-numbers hcf-and-lcm \
            powers-and-exponents roots-and-radicals standard-form approximation-and-estimation \
            significant-figures decimal-places bounds-and-accuracy surds recurring-decimals
          do
            test -f "_site/high-school/study/mathematics/number-and-numeracy/${slug}/index.html" || \
            test -f "_site/high-school/mathematics/number-and-numeracy/${slug}/index.html"
          done

      - name: Verify Algebra study pages
        run: |
          test -f _site/high-school/mathematics/algebra/index.html
          test -f _site/high-school/mathematics/algebra/introduction-to-algebra/index.html
          test -f _site/high-school/mathematics/algebra/variables-and-constants/index.html
          test -f _site/high-school/mathematics/algebra/algebraic-expressions/index.html
          test -f _site/high-school/mathematics/algebra/simplifying-expressions/index.html
          test -f _site/high-school/mathematics/algebra/linear-equations/index.html
          test -f _site/high-school/mathematics/algebra/inequalities/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
