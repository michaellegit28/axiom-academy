# GNOSTIRI GitHub Pages Deployment Workflow
# Domains served: Global static site for High School, University, and Extras.
# Architectural decision: Builds the Jekyll 4.2 site with the GitHub Pages
# base path, then verifies the Phase 1 route contract before deployment.

name: Deploy GNOSTIRI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gnostiri-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GNOSTIRI repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build GNOSTIRI with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Verify GNOSTIRI route contract
        run: |
          test -s _site/index.html
          test -s _site/high-school/index.html
          test -s _site/university/index.html
          test -s _site/extras/index.html
          test -s _site/study/index.html
          test -s _site/quiz/index.html
          test -s _site/tutor/index.html
          test -s _site/profile/index.html
          test -d _site/quiz/high-school
          test -d _site/quiz/university
          test -d _site/quiz/extras

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GNOSTIRI
        id: deployment
        uses: actions/deploy-pages@v4
