title: GNOSTIRI
description: Global Learning & Intelligence — free-first learning spanning school, examinations, university, medicine, science, technology, research, and lifelong learning.
baseurl: "/axiom-academy"
url: "https://michaellegit28.github.io"
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
collections:
  chapters:
    output: true
    permalink: /read/:subject/:path/
  quizzes:
    output: true
    permalink: /quiz/:exam/:subject/:path/
  flashcards:
    output: true
    permalink: /flash/:subject/:path/
  past_questions:
    output: false

defaults:
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: chapter
      sidebar: true
  - scope:
      path: ""
      type: "quizzes"
    values:
      layout: quiz
  - scope:
      path: ""
      type: "flashcards"
    values:
      layout: flash
permalink: /:path/
exclude:
  - docs
  - README.md
  - README-Phase2.md
  - README-Phase4.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.zip"
  - firestore.rules
firebase:
  apiKey: "YOUR_FIREBASE_API_KEY"
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com"
  projectId: "YOUR_PROJECT_ID"
  storageBucket: "YOUR_PROJECT_ID.appspot.com"
  messagingSenderId: "YOUR_SENDER_ID"
  appId: "YOUR_APP_ID"
