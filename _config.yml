title: Axiom Academy
description: A free, university-standard self-study library — Medicine, Physics, Science, Deep Learning.
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  chapters:
    output: true
    permalink: /read/:subject/:path/
  quizzes:
    output: true
    permalink: /quiz/:exam/:subject/:path/
  flashcards:
    output: true
    permalink: /flash/:subject/:path/
  past_questions:
    output: false
defaults:
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: chapter
      sidebar: true
  - scope:
      path: ""
      type: "quizzes"
    values:
      layout: quiz
  - scope:
      path: ""
      type: "flashcards"
    values:
      layout: flash
permalink: /:path/
exclude:
  - README.md
